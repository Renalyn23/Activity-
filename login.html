<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Garfield Paradise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <style>
        body {
            background: url('print.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.92); /* Medyo transparent para makita yung bg */
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 2.5rem;
        }
        .btn-garfield {
            background-color: #ff8c00;
            border: none;
        }
        .btn-garfield:hover {
            background-color: #e67e00;
        }
        .error {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .success {
            color: #198754;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="login-card">
                <h2 class="text-center mb-4">🐱 Login</h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password">
                    </div>
                    <button type="submit" class="btn btn-garfield w-100 text-white">Sign In</button>
                    <p class="text-center mt-3 mb-0">Don't have an account? <a href="../registerPage/register.html">Register here</a></p>
                    <p class="text-center mt-2"><a href="../index.html">← Back to Home</a></p>
                </form>
                <div id="loginMsg" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
<script>
$(function() {
    $('#loginForm').validate({
        rules: {
            username: { required: true },
            password: { required: true }
        },
        messages: {
            username: { required: "Please enter your username" },
            password: { required: "Please enter your password" }
        },
        submitHandler: function() {
            const user = $('#username').val().trim();
            const pass = $('#password').val();
            
            // Static credentials
            if (user === 'admin' && pass === '12345') {
                $('#loginMsg').html('<div class="alert alert-success">✅ Login successful! Redirecting...</div>');
                localStorage.setItem("loggedInUser", user); // I-save para makapasok sa main page
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1000);
            } else {
                $('#loginMsg').html('<div class="alert alert-danger">❌ Invalid username or password. Try again.</div>');
            }
            return false;
        }
    });
});
</script>
</body>
</html>
