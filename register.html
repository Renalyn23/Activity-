<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Garfield Paradise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
    <style>
        body {
            background: url('print.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.92); /* Medyo transparent para makita yung background */
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 2.5rem;
        }
        .btn-garfield {
            background-color: #ff8c00;
            border: none;
        }
        .btn-garfield:hover {
            background-color: #e67e00;
        }
        .error {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="register-card">
                <h2 class="text-center mb-4">🐱 Create Account</h2>
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password">
                    </div>
                    <button type="submit" class="btn btn-garfield w-100 text-white">Register</button>
                    <p class="text-center mt-3 mb-0">Already have an account? <a href="../loginPage/login.html">Login here</a></p>
                    <p class="text-center mt-2"><a href="../index.html">← Back to Home</a></p>
                </form>
                <div id="regMsg" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
<script>
$(function() {
    $('#registerForm').validate({
        rules: {
            name: { required: true, minlength: 3 },
            email: { required: true, email: true },
            password: { required: true, minlength: 5 },
            confirm_password: { required: true, equalTo: "#password" }
        },
        messages: {
            name: {
                required: "Please enter your full name",
                minlength: "Name must be at least 3 characters"
            },
            email: {
                required: "Please enter your email",
                email: "Enter a valid email address"
            },
            password: {
                required: "Create a password",
                minlength: "Password must be at least 5 characters"
            },
            confirm_password: {
                required: "Confirm your password",
                equalTo: "Passwords do not match"
            }
        },
        submitHandler: function() {
            $('#regMsg').html('<div class="alert alert-success">✅ Registration successful! You can now <a href="../loginPage/login.html">login</a>.</div>');
            $('#registerForm')[0].reset();
        }
    });
});
</script>
</body>
</html>
